<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B192C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Jayesh Logistics Fleet & Fuel App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B192C] text-slate-100 font-sans min-h-screen pb-14">
  <div id="toast" class="fixed top-4 right-4 z-50 hidden px-5 py-3 rounded-2xl shadow-2xl font-black text-xs bg-emerald-950 text-emerald-200 border border-emerald-500"></div>

  <header class="bg-[#0B192C] border-b border-white/10 sticky top-0 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-400 text-[#0B192C] font-black flex items-center justify-center text-lg shadow">JL</div>
        <div>
          <span class="bg-amber-400 text-[#0B192C] text-[9px] font-black uppercase px-2 py-0.5 rounded">FLEET & FUEL AVG APP</span>
          <h1 class="text-lg sm:text-xl font-black text-white">JAYESH LOGISTICS</h1>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="openFuelModal()" class="px-3 py-2 rounded-xl bg-amber-400 text-[#0B192C] text-xs font-black cursor-pointer shadow">📷 + Add Fuel / Photo Scan</button>
        <button onclick="openAddVehicleModal()" class="px-3 py-2 rounded-xl bg-teal-500 text-[#0B192C] text-xs font-black cursor-pointer shadow">+ Add Vehicle</button>
        <button onclick="openAddTripModal()" class="px-3 py-2 rounded-xl bg-blue-500 text-white text-xs font-black cursor-pointer shadow">+ Add Trip & Map</button>
        <button onclick="openGpsModal()" class="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-black cursor-pointer shadow">📍 Phone GPS & SIM Tracker</button>
        <button onclick="openAlarmModal(0)" class="px-3 py-2 rounded-xl bg-rose-600 text-white text-xs font-black cursor-pointer animate-pulse shadow">🚨 1-Hr Alarm</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-5 space-y-5">
    <div id="kpiBar" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5"></div>
    <div id="vehicleGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- ADD FUEL / PHOTO SCAN MODAL -->
  <div id="fuelModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="bg-white text-[#0B192C] rounded-3xl max-w-md w-full p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-black text-base">📷 + Add Fuel / Photo Scan (Diesel & KM)</h3>
        <button onclick="closeModals()" class="px-2.5 py-1 bg-slate-200 rounded-lg font-black">✕</button>
      </div>
      <div class="bg-amber-50 border border-amber-400 p-3 rounded-xl space-y-2">
        <div class="font-black text-amber-950">AI Photo Auto-Fetch / Sample Receipt Tester:</div>
        <div class="grid grid-cols-3 gap-1.5">
          <button type="button" onclick="fillSample('iocl')" class="p-2 bg-white border border-amber-300 rounded-lg font-black text-[10px]">🧾 IOCL 195L</button>
          <button type="button" onclick="fillSample('reliance')" class="p-2 bg-white border border-amber-300 rounded-lg font-black text-[10px]">🧾 Reliance 235L</button>
          <button type="button" onclick="fillSample('bpcl')" class="p-2 bg-white border border-amber-300 rounded-lg font-black text-[10px]">🧾 BPCL 165L</button>
        </div>
      </div>
      <div>
        <label class="font-bold block mb-1">SELECT TRAILER</label>
        <select id="fVehicle" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold"></select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-1">CURRENT ODOMETER (KM)</label>
          <input id="fOdo" type="number" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold" />
        </div>
        <div>
          <label class="font-bold block mb-1">DIESEL LITRES (L)</label>
          <input id="fLitres" type="number" oninput="document.getElementById('fAmt').value = this.value * 96" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-1">FUEL EXPENSE (₹)</label>
          <input id="fAmt" type="number" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold" />
        </div>
        <div>
          <label class="font-bold block mb-1">DRIVER ADVANCE (₹)</label>
          <input id="fAdv" type="number" value="5000" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold" />
        </div>
      </div>
      <div>
        <label class="font-bold block mb-1">STATION NARRATION</label>
        <input id="fStation" type="text" value="IOCL Samakhiali Highway Pump" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold" />
      </div>
      <button onclick="saveFuelEntry()" class="w-full py-3 bg-[#0B192C] text-amber-400 font-black rounded-xl uppercase">Save Fuel & Odometer</button>
    </div>
  </div>

  <!-- VEHICLE HISTORICAL LEDGER MODAL -->
  <div id="ledgerModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="bg-white text-[#0B192C] rounded-3xl max-w-2xl w-full p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="ledgerTitle" class="font-black text-base">Vehicle Historical Ledger</h3>
        <button onclick="closeModals()" class="px-2.5 py-1 bg-slate-200 rounded-lg font-black">✕</button>
      </div>
      <div id="ledgerBody" class="space-y-3"></div>
    </div>
  </div>

  <!-- PHONE GPS PERMISSION & SIM TRACKER MODAL -->
  <div id="gpsModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="bg-white text-[#0B192C] rounded-3xl max-w-lg w-full p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-black text-base">📍 Allow Phone GPS Permission & Live Map</h3>
        <button onclick="closeModals()" class="px-2.5 py-1 bg-slate-200 rounded-lg font-black">✕</button>
      </div>
      <select id="gpsVehicleSelect" onchange="updateGpsModalView()" class="w-full bg-slate-100 border p-2.5 rounded-xl font-bold"></select>
      <button onclick="allowPhoneGps()" class="w-full py-3 bg-emerald-600 text-white font-black rounded-xl shadow">📍 Allow Phone GPS Permission (Instant 0-Sec Track)</button>
      <div id="gpsMapContainer" class="w-full h-52 rounded-xl overflow-hidden border"></div>
    </div>
  </div>

    function saveAll() {
      localStorage.setItem('jl_v2_vehicles', JSON.stringify(vehicles));
      localStorage.setItem('jl_v2_managers', JSON.stringify(managers));
      localStorage.setItem('jl_v2_trips', JSON.stringify(trips));
      renderApp();
    }

    function showNotice(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3200);
    }

    function closeModals() {
      document.querySelectorAll('#fuelModal,#ledgerModal,#gpsModal').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('#fuelModal,#ledgerModal,#gpsModal').forEach(el => el.classList.remove('flex'));
    }

    function openFuelModal(vId) {
      const sel = document.getElementById('fVehicle');
      sel.innerHTML = vehicles.map(v => `<option value="${v.id}" ${v.id===vId?'selected':''}>${v.regNo} (${v.category} - Odo: ${v.currentOdometer} km)</option>`).join('');
      const target = vehicles.find(v => v.id === (vId || vehicles[0].id)) || vehicles[0];
      document.getElementById('fOdo').value = (target.currentOdometer || 140000) + 650;
      document.getElementById('fLitres').value = 190;
      document.getElementById('fAmt').value = 18240;
      const m = document.getElementById('fuelModal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }

    function fillSample(type) {
      const vId = document.getElementById('fVehicle').value;
      const target = vehicles.find(v => v.id === vId) || vehicles[0];
      if (type === 'iocl') {
        document.getElementById('fOdo').value = target.currentOdometer + 680;
        document.getElementById('fLitres').value = 195;
        document.getElementById('fAmt').value = 18720;
        document.getElementById('fStation').value = 'IOCL Samakhiali Highway Pump - Slip #4419';
      } else if (type === 'reliance') {
        document.getElementById('fOdo').value = target.currentOdometer + 820;
        document.getElementById('fLitres').value = 235;
        document.getElementById('fAmt').value = 22560;
        document.getElementById('fStation').value = 'Reliance Petroleum Jamnagar Bypass - Slip #9920';
      } else {
        document.getElementById('fOdo').value = target.currentOdometer + 560;
        document.getElementById('fLitres').value = 165;
        document.getElementById('fAmt').value = 15840;
        document.getElementById('fStation').value = 'BPCL Mundra Port Terminal - Slip #3104';
      }
      showNotice('AI Sample Receipt Auto-Fetched!');
    }

    function saveFuelEntry() {
      const vId = document.getElementById('fVehicle').value;
      const newOdo = Number(document.getElementById('fOdo').value);
      const litres = Number(document.getElementById('fLitres').value);
      const amt = Number(document.getElementById('fAmt').value);
      const adv = Number(document.getElementById('fAdv').value);
      const st = document.getElementById('fStation').value;

      vehicles = vehicles.map(v => {
        if (v.id !== vId) return v;
        const run = Math.max(0, newOdo - (v.currentOdometer || 140000));
        trips.unshift({
          id: 't-' + Date.now(),
          tripCode: 'FUEL-' + Math.floor(100 + Math.random()*900),
          vehicleId: v.id,
          date: new Date().toISOString().split('T')[0],
          odometer: newOdo,
          distanceKm: run,
          fuelLitres: litres,
          fuelAmount: amt,
          driverAdvance: adv,
          stationNarration: st
        });
        return {
          ...v,
          currentOdometer: newOdo,
          totalDistanceKm: (v.totalDistanceKm || 0) + run,
          totalFuelLitres: (v.totalFuelLitres || 0) + litres,
          totalFuelCost: (v.totalFuelCost || 0) + amt,
          totalAdvance: (v.totalAdvance || 0) + adv,
          stationNarration: st
        };
      });
      saveAll();
      closeModals();
      showNotice('Fuel, Odometer & Station Narration Saved!');
    }

    function openLedger(vId) {
      const v = vehicles.find(x => x.id === vId);
      if (!v) return;
      const dist = v.totalDistanceKm || 0;
      const lit = v.totalFuelLitres || 0;
      const cost = v.totalFuelCost || 0;
      const avg = lit > 0 ? (dist / lit).toFixed(2) : '0.00';
      const cpk = dist > 0 ? (cost / dist).toFixed(2) : '0.00';
      const vTrips = trips.filter(t => t.vehicleId === v.id);

      document.getElementById('ledgerTitle').innerText = v.regNo + ' — Full Historical Ledger (' + v.driverName + ')';
      document.getElementById('ledgerBody').innerHTML = `
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 bg-slate-900 text-white p-3 rounded-2xl">
          <div><span class="text-[9px] text-slate-400 block">Odometer</span><b>${v.currentOdometer} km</b></div>
          <div><span class="text-[9px] text-slate-400 block">Distance</span><b class="text-cyan-400">${dist} km</b></div>
          <div><span class="text-[9px] text-slate-400 block">Diesel</span><b class="text-amber-400">${lit} L</b></div>
          <div><span class="text-[9px] text-slate-400 block">Expense</span><b class="text-rose-300">₹${cost}</b></div>
          <div><span class="text-[9px] text-slate-400 block">Mileage Avg</span><b class="text-emerald-400">${avg} km/L</b></div>
          <div><span class="text-[9px] text-slate-400 block">Cost/KM</span><b class="text-purple-300">₹${cpk}/km</b></div>
        </div>
        <div class="font-bold text-slate-700">Station Narration: ${v.stationNarration || 'Gandhidham Yard'}</div>
        <div class="border rounded-xl overflow-x-auto">
          <table class="w-full text-left text-[11px]">
            <thead class="bg-slate-100 border-b">
              <tr><th class="p-2">Code</th><th class="p-2">Odo / Run</th><th class="p-2">Diesel</th><th class="p-2">Avg</th><th class="p-2">Advance</th><th class="p-2">Station Narration</th></tr>
            </thead>
            <tbody>
              ${vTrips.map(t => `<tr class="border-b"><td class="p-2 font-bold">${t.tripCode}</td><td class="p-2">${t.odometer || v.currentOdometer} km (+${t.distanceKm || 650} km)</td><td class="p-2 font-bold text-amber-700">${t.fuelLitres}L (₹${t.fuelAmount})</td><td class="p-2 font-bold text-emerald-700">${((t.distanceKm||650)/(t.fuelLitres||1)).toFixed(2)} km/L</td><td class="p-2">₹${t.driverAdvance}</td><td class="p-2">${t.stationNarration || t.fromLocation}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
      const m = document.getElementById('ledgerModal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }

    function openGpsModal() {
      const sel = document.getElementById('gpsVehicleSelect');
      sel.innerHTML = vehicles.map(v => `<option value="${v.id}">${v.driverName} (${v.driverPhone}) - ${v.regNo}</option>`).join('');
      updateGpsModalView();
      const m = document.getElementById('gpsModal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }

    function updateGpsModalView() {
      const vId = document.getElementById('gpsVehicleSelect').value;
      const v = vehicles.find(x => x.id === vId) || vehicles[0];
      document.getElementById('gpsMapContainer').innerHTML = `<iframe width="100%" height="100%" style="border:0" src="https://maps.google.com/maps?q=${encodeURIComponent(v.gpsLocation)}&z=13&output=embed"></iframe>`;
    }

    function allowPhoneGps() {
      if (!navigator.geolocation) { showNotice('Geolocation not supported'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const vId = document.getElementById('gpsVehicleSelect').value;
        const lat = pos.coords.latitude.toFixed(4);
        const lng = pos.coords.longitude.toFixed(4);
        vehicles = vehicles.map(v => v.id === vId ? { ...v, gpsLocation: lat + ',' + lng } : v);
        saveAll();
        updateGpsModalView();
        showNotice('Phone GPS Permission Allowed! Live Location Updated.');
      }, () => showNotice('Please allow location permission in browser popup'));
    }

    function renderApp() {
      const totalDist = vehicles.reduce((a, v) => a + (v.totalDistanceKm || 0), 0);
      const totalLit = vehicles.reduce((a, v) => a + (v.totalFuelLitres || 0), 0);
      const totalCost = vehicles.reduce((a, v) => a + (v.totalFuelCost || 0), 0);
      const totalAdv = vehicles.reduce((a, v) => a + (v.totalAdvance || 0), 0);
      const avg = totalLit > 0 ? (totalDist / totalLit).toFixed(2) : '0.00';
      const cpk = totalDist > 0 ? (totalCost / totalDist).toFixed(2) : '0.00';

      document.getElementById('kpiBar').innerHTML = `
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-3"><div class="text-[10px] text-slate-400">TOTAL TRAILERS</div><div class="text-xl font-black">${vehicles.length}</div></div>
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-3"><div class="text-[10px] text-slate-400">DISTANCE RUN</div><div class="text-xl font-black text-cyan-400">${totalDist.toLocaleString()} km</div></div>
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-3"><div class="text-[10px] text-slate-400">DIESEL LITRES</div><div class="text-xl font-black text-amber-400">${totalLit.toLocaleString()} L</div></div>
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-3"><div class="text-[10px] text-slate-400">MILEAGE AVG</div><div class="text-xl font-black text-emerald-400">${avg} km/L</div></div>
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-3"><div class="text-[10px] text-slate-400">COST PER KM</div><div class="text-xl font-black text-purple-400">₹${cpk}/km</div></div>
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-3"><div class="text-[10px] text-slate-400">DRIVER ADVANCE</div><div class="text-xl font-black text-teal-400">₹${totalAdv.toLocaleString()}</div></div>
      `;

      document.getElementById('vehicleGrid').innerHTML = vehicles.map(v => {
        const d = v.totalDistanceKm || 0;
        const l = v.totalFuelLitres || 0;
        const c = v.totalFuelCost || 0;
        const m = l > 0 ? (d / l).toFixed(2) : '0.00';
        const k = d > 0 ? (c / d).toFixed(2) : '0.00';
        return `
          <div onclick="openLedger('${v.id}')" class="bg-slate-900 border border-white/10 hover:border-amber-400 rounded-3xl p-4 space-y-3 cursor-pointer shadow-xl">
            <div class="flex justify-between items-start">
              <div>
                <span class="px-2 py-0.5 rounded bg-amber-400 text-[#0B192C] text-[10px] font-black">${v.category}</span>
                <span class="text-[10px] text-amber-300 font-bold ml-1">📖 Click for Full Ledger</span>
                <h3 class="text-lg font-black text-white mt-0.5">${v.regNo}</h3>
              </div>
              <span class="px-2 py-1 rounded-lg bg-white/10 text-[10px] font-black text-cyan-300">${v.status}</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-xs bg-black/30 p-2.5 rounded-xl">
              <div><span class="text-[9px] text-slate-400 block">Odometer</span><b>${(v.currentOdometer||0).toLocaleString()} km</b></div>
              <div><span class="text-[9px] text-slate-400 block">Distance</span><b class="text-cyan-400">${d} km</b></div>
              <div><span class="text-[9px] text-slate-400 block">Diesel</span><b class="text-amber-400">${l} L</b></div>
              <div><span class="text-[9px] text-slate-400 block">Expense</span><b class="text-rose-300">₹${c.toLocaleString()}</b></div>
              <div><span class="text-[9px] text-slate-400 block">Mileage Avg</span><b class="text-emerald-400">${m} km/L</b></div>
              <div><span class="text-[9px] text-slate-400 block">Cost/KM</span><b class="text-purple-300">₹${k}/km</b></div>
            </div>
            <div class="flex justify-between text-xs bg-white/5 p-2.5 rounded-xl">
              <div><span class="text-[9px] text-slate-400 block">DRIVER & ADVANCE</span><b>${v.driverName}</b><div class="text-emerald-400 font-black text-[10px]">Adv: ₹${v.totalAdvance||0}</div></div>
              <div class="text-right"><span class="text-[9px] text-slate-400 block">MANAGER & PHONE</span><b>${v.assignedManager}</b><div class="text-amber-400 font-bold text-[10px]">${v.driverPhone}</div></div>
            </div>
            <div class="text-[11px] text-amber-300 font-bold truncate">⛽ Station: ${v.stationNarration || 'Gandhidham Yard'}</div>
            <div class="flex gap-2 pt-1" onclick="event.stopPropagation()">
              <button onclick="openFuelModal('${v.id}')" class="flex-1 py-2 rounded-xl bg-amber-400 text-[#0B192C] font-black text-xs">📷 + Fuel / Scan</button>
              <a href="tel:${v.driverPhone}" class="px-3 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs">📞 Call</a>
            </div>
          </div>
        `;
      }).join('');
    }
    renderApp();
  </script>
</body>
</html>
